[analysis]
name = "wz_vbs_nominal"
year = "Run2024"

[validation.compare]
tree = "Events"
rtol = 1e-5
atol = 1e-4

[[validation.compare.branch_tolerance]]
branch = "PuppiMET_phiDef"
rtol = 0.0
atol = 0.02
reason = "Legacy Type-1 MET depends on stochastic lepton/JER smearing not replayed by the Rust interpreter."

[[validation.compare.branch_tolerance]]
branch = "PuppiMET_ptDef"
rtol = 0.0
atol = 0.01
reason = "Legacy Type-1 MET depends on stochastic lepton/JER smearing not replayed by the Rust interpreter."

[[validation.compare.branch_tolerance]]
branch = "m3lDef"
rtol = 0.0
atol = 2.0
reason = "Three-lepton mass uses legacy stochastic lepton pT corrections."

[[validation.compare.branch_tolerance]]
branch = "mllZDef"
rtol = 0.0
atol = 0.5
reason = "Z mass uses legacy stochastic electron pT corrections."

[[validation.compare.branch_tolerance]]
branch = "mtWDef"
rtol = 0.0
atol = 2.0
reason = "W transverse mass depends on stochastic lepton and Type-1 MET corrections."

[[validation.compare.branch_tolerance]]
branch = "ptlWDef"
rtol = 0.0
atol = 1.0
reason = "W lepton pT uses legacy stochastic muon pT correction."

[[validation.compare.branch_tolerance]]
branch = "vbs_sumHT"
rtol = 0.0
atol = 0.1
reason = "Legacy jet/JER stochastic path leaves a small HT residual."

[[correction]]
name = "clean_jet_pt_jec"
kind = "jec_nominal"
file = "configs/corrections/POG/JME/Run3-24CDEReprocessingFGHIPrompt-Summer24-NanoAODv15/jet_jerc.json.gz"
correction = "Summer24Prompt24_V2_MC_L1L2L3Res_AK4PFPuppi"
collection = "clean_jet"
attr = "ptJec"
source_attr = "pt"
raw_factor_attr = "rawFactor"
inputs = [
  { name = "JetA", from = "area" },
  { name = "JetEta", from = "eta" },
  { name = "JetPt", from = "raw_pt" },
  { name = "Rho", from = "Rho_fixedGridRhoFastjetAll" },
  { name = "JetPhi", from = "phi" },
]

