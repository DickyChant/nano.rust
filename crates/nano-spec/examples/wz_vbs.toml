  { name = "JetPt", from = "ptJec" },
  { name = "systematic", value = "nom" },
]
resolution_file = "configs/corrections/POG/JME/Run3-24CDEReprocessingFGHIPrompt-Summer24-NanoAODv15/jet_jerc.json.gz"
